<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sticker Extractor</title>
    <meta name="theme-color" content="#121212">
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text: #ffffff;
            --text-muted: #a1a1aa;
            --border: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--surface);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }
        .version-tag {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 0.7rem;
            color: var(--text-muted);
            font-family: monospace;
            opacity: 0.5;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            background-color: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button:hover { background-color: #2a2a2a; }
        button.primary {
            background-color: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        button.primary:hover { background-color: var(--primary-hover); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .canvas-wrapper {
            position: relative;
            width: 100%;
            min-height: 400px;
            background-image: linear-gradient(45deg, #2a2a2a 25%, transparent 25%), linear-gradient(-45deg, #2a2a2a 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #2a2a2a 75%), linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
            background-size: 20px 20px;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px dashed var(--border);
        }
        canvas {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
        }
        #fileInput { display: none; }
        .status-bar {
            margin-top: 20px;
            background: #252525;
            border-radius: 6px;
            height: 8px;
            width: 100%;
            overflow: hidden;
            display: none;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.1s;
        }
        .status-text {
            margin-top: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
        }
        .badge {
            display: inline-block;
            background: rgba(167, 139, 250, 0.2);
            color: #c4b5fd;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <span class="badge">Running on Cloud (RMBG-1.4)</span>
    <h1>Object Extractor</h1>
    <p>Using your custom Hugging Face Space API.</p>

    <div class="container">
        <div class="version-tag">App v1.1.5</div>

        <div class="toolbar">
            <button onclick="document.getElementById('fileInput').click()">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                Upload
            </button>
            <button class="primary" id="processBtn" onclick="processImage()" disabled>
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                Process
            </button>
            <button onclick="downloadResult()" id="downloadBtn" disabled>
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Save
            </button>
        </div>

        <input type="file" id="fileInput" accept="image/*" onchange="loadImage(event)">

        <div class="canvas-wrapper">
            <canvas id="mainCanvas"></canvas>
        </div>

        <div class="status-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="status-text" id="statusText">Ready</div>
    </div>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(reg => {
                console.log('SW registered');
                reg.addEventListener('updatefound', () => {
                    const newWorker = reg.installing;
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            window.location.reload();
                        }
                    });
                });
            });
        }
    </script>

    <!-- App Logic -->
    <script type="module">
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client@0.1.4/dist/index.min.js";

        // *** CONFIGURATION ***
        const HF_SPACE_ID = "AIIntentionz/MorphFrame"; // Ensure this matches exactly
        // *********************

        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        let originalFile = null;
        let resultBlobUrl = null;

        window.loadImage = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            originalFile = file;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.clearRect(0,0,canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                    
                    document.getElementById('processBtn').disabled = false;
                    document.getElementById('downloadBtn').disabled = true;
                    updateStatus("Image loaded.");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.processImage = async function() {
            if (!originalFile) return;

            const btn = document.getElementById('processBtn');
            const pBar = document.getElementById('progressBar');
            const pFill = document.getElementById('progressFill');

            btn.disabled = true;
            pBar.style.display = 'block';
            pFill.style.width = "5%";
            updateStatus("Connecting to Space...");

            try {
                // Connect to the public space
                const client = await Client.connect(HF_SPACE_ID);
                
                pFill.style.width = "40%";
                updateStatus("Processing on Cloud GPU...");

                // Call the prediction endpoint
                const result = await client.predict("/predict", { 
                    image: originalFile, 
                });

                pFill.style.width = "90%";
                updateStatus("Downloading result...");

                if (result.data && result.data[0]) {
                    // Gradio returns an object with url
                    const outputData = result.data[0];
                    let imageUrl = outputData.url || outputData;

                    // Fetch blob to avoid CORS issues on export
                    const resp = await fetch(imageUrl);
                    const blob = await resp.blob();
                    resultBlobUrl = URL.createObjectURL(blob);

                    const img = new Image();
                    img.onload = function() {
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.clearRect(0,0,canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0);

                        updateStatus("Done!");
                        document.getElementById('downloadBtn').disabled = false;
                        btn.disabled = false;
                        pBar.style.display = 'none';
                    };
                    img.src = resultBlobUrl;
                } else {
                    throw new Error("Empty response from AI");
                }

            } catch (error) {
                console.error(error);
                updateStatus("Error: " + error.message);
                btn.disabled = false;
                pBar.style.display = 'none';
            }
        };

        window.downloadResult = function() {
            if (!resultBlobUrl) return;
            const link = document.createElement('a');
            link.download = 'sticker.png';
            link.href = resultBlobUrl;
            link.click();
        };

        function updateStatus(msg) {
            document.getElementById('statusText').innerText = msg;
        }
    </script>
</body>
</html>
