<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sticker Extractor</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text: #ffffff;
            --text-muted: #a1a1aa;
            --border: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 { font-weight: 700; letter-spacing: -0.5px; margin-bottom: 5px; }
        p { color: var(--text-muted); font-size: 0.9rem; margin-top: 0; }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--surface);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        .version-tag {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 0.7rem;
            color: var(--text-muted);
            font-family: monospace;
            opacity: 0.5;
        }

        /* Settings Area */
        .settings-box {
            background: #252525;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        .settings-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }
        label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
        
        select, input[type="text"] {
            background: #121212;
            border: 1px solid var(--border);
            color: white;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        .token-help {
            font-size: 0.75rem;
            color: #60a5fa;
            margin-top: 4px;
        }
        .hidden { display: none; }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover { background-color: #2a2a2a; }
        
        button.primary {
            background-color: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        button.primary:hover { background-color: var(--primary-hover); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            min-height: 400px;
            background-image: 
                linear-gradient(45deg, #2a2a2a 25%, transparent 25%), 
                linear-gradient(-45deg, #2a2a2a 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #2a2a2a 75%), 
                linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px dashed var(--border);
        }

        canvas {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
        }

        #fileInput { display: none; }

        .status-bar {
            margin-top: 20px;
            background: #252525;
            border-radius: 6px;
            height: 8px;
            width: 100%;
            overflow: hidden;
            display: none;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.1s;
        }
        .status-text {
            margin-top: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            min-height: 20px;
        }

        .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <span class="badge" id="modelBadge">Running AI Locally</span>
    <h1>Object Extractor</h1>
    <p>Upload an image to remove the background.</p>

    <div class="container">
        <div class="version-tag">App v1.0.4</div>

        <!-- Settings Area -->
        <div class="settings-box">
            <div class="settings-row">
                <label for="modelSelect">AI Model</label>
                <select id="modelSelect" onchange="toggleTokenInput()">
                    <option value="Xenova/modnet">ModNet (Fast, No Login, Good for People)</option>
                    <option value="Xenova/rmbg-1.4">RMBG-1.4 (SOTA, Best Quality, Requires Token)</option>
                </select>
            </div>
            <div class="settings-row hidden" id="tokenRow">
                <label for="hfToken">Hugging Face Access Token (Read)</label>
                <input type="text" id="hfToken" placeholder="hf_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx">
                <div class="token-help">
                    RMBG-1.4 requires a free token. <a href="https://huggingface.co/settings/tokens" target="_blank" style="color:#60a5fa">Get one here</a>.
                </div>
            </div>
        </div>

        <div class="toolbar">
            <button onclick="document.getElementById('fileInput').click()">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                Upload
            </button>
            <button class="primary" id="processBtn" onclick="processImage()" disabled>
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                Process
            </button>
            <button onclick="downloadResult()" id="downloadBtn" disabled>
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Save
            </button>
        </div>

        <input type="file" id="fileInput" accept="image/*" onchange="loadImage(event)">

        <div class="canvas-wrapper">
            <canvas id="mainCanvas"></canvas>
        </div>

        <div class="status-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="status-text" id="statusText">Ready</div>
    </div>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.16.0';

        env.allowLocalModels = false;
        env.useBrowserCache = true;

        let active_pipeline = null;
        let active_model_id = "";
        
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        let originalImage = null; 
        let processedCanvas = document.createElement('canvas'); 

        // UI Logic for Token
        window.toggleTokenInput = function() {
            const select = document.getElementById('modelSelect');
            const row = document.getElementById('tokenRow');
            const badge = document.getElementById('modelBadge');
            
            if (select.value === 'Xenova/rmbg-1.4') {
                row.classList.remove('hidden');
                badge.innerText = "Selected: RMBG-1.4 (High Quality)";
            } else {
                row.classList.add('hidden');
                badge.innerText = "Selected: ModNet (Fast)";
            }
        }

        window.loadImage = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    originalImage = img;
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    document.getElementById('processBtn').disabled = false;
                    document.getElementById('downloadBtn').disabled = true;
                    updateStatus("Image loaded.");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.processImage = async function() {
            if (!originalImage) return;

            const btn = document.getElementById('processBtn');
            const pBar = document.getElementById('progressBar');
            const pFill = document.getElementById('progressFill');
            const modelId = document.getElementById('modelSelect').value;
            const token = document.getElementById('hfToken').value.trim();

            btn.disabled = true;
            pBar.style.display = 'block';

            try {
                // Check if we need to load/reload pipeline
                if (!active_pipeline || active_model_id !== modelId) {
                    updateStatus(`Downloading ${modelId}...`);
                    
                    const pipelineOptions = {
                        progress_callback: (cb) => {
                            if (cb.status === 'progress') {
                                const percent = Math.round(cb.progress);
                                pFill.style.width = percent + "%";
                                updateStatus(`Loading model: ${percent}%`);
                            }
                        }
                    };

                    // Add auth token if RMBG is selected and token exists
                    if (modelId === 'Xenova/rmbg-1.4') {
                        if(token) {
                            pipelineOptions.use_auth_token = token;
                        } else {
                            // Warn user but try anyway (will likely fail)
                            if(!confirm("You selected RMBG-1.4 but didn't provide a Hugging Face Token. This will likely fail. Continue?")) {
                                throw new Error("Token missing for RMBG-1.4");
                            }
                        }
                    }

                    active_pipeline = await pipeline('image-segmentation', modelId, pipelineOptions);
                    active_model_id = modelId;
                }

                updateStatus("Processing...");
                pFill.style.width = "100%"; 

                const result = await active_pipeline(originalImage.src);
                await applyMask(result);

                updateStatus("Done!");
                document.getElementById('downloadBtn').disabled = false;
                btn.disabled = false;
                pBar.style.display = 'none';

            } catch (error) {
                console.error(error);
                updateStatus("Error: " + error.message);
                btn.disabled = false;
                pBar.style.display = 'none';
            }
        };

        async function applyMask(maskObj) {
            // Some models return different structures, verify mask
            let maskSrc;
            // ModNet returns { mask: Image } or similar, Transformers.js normalizes this usually
            // but let's safely handle the blob conversion
            if (maskObj.toDataURL) {
                maskSrc = maskObj.toDataURL();
            } else if (maskObj.mask && maskObj.mask.toDataURL) {
                maskSrc = maskObj.mask.toDataURL();
            } else {
                // Fallback for raw tensor output if pipeline varies (rare in this task)
                maskSrc = maskObj[0].mask.toDataURL();
            }

            const maskImage = new Image();
            maskImage.src = maskSrc;
            await new Promise(r => maskImage.onload = r);

            processedCanvas.width = originalImage.width;
            processedCanvas.height = originalImage.height;
            const pCtx = processedCanvas.getContext('2d');

            pCtx.drawImage(maskImage, 0, 0, processedCanvas.width, processedCanvas.height);
            pCtx.globalCompositeOperation = 'source-in';
            pCtx.drawImage(originalImage, 0, 0);
            pCtx.globalCompositeOperation = 'source-over';

            canvas.width = processedCanvas.width;
            canvas.height = processedCanvas.height;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(processedCanvas, 0, 0);
        }

        window.downloadResult = function() {
            const link = document.createElement('a');
            link.download = 'sticker-export.png';
            link.href = processedCanvas.toDataURL('image/png');
            link.click();
        };

        function updateStatus(msg) {
            document.getElementById('statusText').innerText = msg;
        }
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(registration => {
                console.log('SW registered:', registration);
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    console.log('New version detected. Reloading...');
                    window.location.reload();
                });
            }).catch(error => {
                console.log('SW registration failed:', error);
            });
        }
    </script>
</body>
</html>
